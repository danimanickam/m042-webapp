# M042 Webapp: app and database in separate containers.
# Start:   docker compose up -d
# Restart: docker compose restart   (NEVER "down -v": that deletes the database volume)

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      # Secret comes only from the local .env file (not in the repository).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      # Named volume: data survives container restarts and re-creation (M1).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No published port: the database is only reachable from the app container.

  app:
    # Built by GitHub Actions (with the commit hash as version) and kept current by "updater".
    image: ghcr.io/danimanickam/m042-webapp:latest
    restart: unless-stopped
    labels:
      # Only containers with this label are updated automatically (see WATCHTOWER_LABEL_ENABLE).
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      PGHOST: db
      PGUSER: app
      PGDATABASE: app
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    ports:
      # Only reachable from this Mac (localhost), not from the local network.
      - "127.0.0.1:8080:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    # Cloudflare Quick Tunnel: public https://<random>.trycloudflare.com URL, no account/token.
    # The URL changes whenever this container restarts. Find it: docker compose logs tunnel
    # No watchtower label on purpose, so app updates never change the public URL.
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:3000"]
    depends_on:
      app:
        condition: service_healthy

  updater:
    # Maintained fork of Watchtower (containrrr/watchtower is archived).
    image: nickfedor/watchtower:1.24.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"    # touch only labelled containers (app), never db
      WATCHTOWER_POLL_INTERVAL: "60"     # check ghcr.io for a new image every 60 s
      WATCHTOWER_CLEANUP: "true"         # remove the old app image after an update
      WATCHTOWER_REMOVE_VOLUMES: "false" # never delete volumes (explicit, is the default)
      TZ: Europe/Zurich
    volumes:
      # Needed to pull images and recreate the app container. Powerful access: see checklist.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
